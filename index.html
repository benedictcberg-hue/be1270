<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.login-form{width:min(100%,340px);display:flex;flex-direction:column;gap:12px}.row{display:grid;grid-template-columns:1fr 56px;gap:10px}input,button{min-height:50px;border:1px solid #d0d0d0;border-radius:12px;background:#fff;font:inherit}input{width:100%;padding:0 16px}.row button{width:56px;font-size:24px}.send{width:100%}.error{min-height:20px;color:#b00020;font-size:14px}.app{padding:14px}.app[hidden],.login[hidden]{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{padding:0 14px}.stage{position:relative;width:100%;max-width:700px;margin:auto;aspect-ratio:3/4;overflow:hidden;border-radius:22px;background:#101820;touch-action:none}.stage video,.stage img{display:block;width:100%;height:100%;object-fit:cover}.stage img{position:absolute;inset:0;z-index:1;pointer-events:none}.hint{position:absolute;z-index:4;top:12px;left:12px;right:12px;padding:10px;border-radius:10px;color:#fff;background:#0008;font-size:14px}.point{position:absolute;z-index:6;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid #fff;border-radius:50%;background:#e33;touch-action:none}.point[hidden],.ruler[hidden],#photo[hidden]{display:none}.ruler{position:absolute;z-index:5;width:280px;height:54px;border:2px solid #fff;border-radius:8px;background:#fff3;box-shadow:0 2px 12px #0006;touch-action:none;user-select:none;backdrop-filter:blur(2px)}.ruler-scale{display:flex;justify-content:space-around;color:#fff;padding-top:7px;font-size:12px}.ruler-scale span{position:relative}.ruler-scale span:before{content:"";position:absolute;top:16px;left:50%;height:22px;border-left:1px solid #fff}.rotate{position:absolute;right:-18px;top:-18px;width:36px;height:36px;min-height:36px;border-radius:50%;color:#fff;background:#000b}.status{max-width:700px;margin:10px auto;font-size:14px}.photo{max-width:700px;margin:12px auto}.photo img{width:100%;height:auto;border-radius:16px}.small{font-size:12px;color:#555}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-form" autocomplete="off"><div class="row"><input id="code" type="password" inputmode="text" aria-label="Code"><button id="question" type="button">?</button></div><button class="send" type="submit">Senden</button><div id="error" class="error"></div></form></section>
<section id="app" class="app" hidden><div class="toolbar"><button id="start">Kamera starten</button><button id="calibrate">Kalibrierung</button><button id="rulerToggle">Lineal</button><button id="take">Foto aufnehmen</button><button id="reset">Zurücksetzen</button></div><div class="stage" id="stage"><video id="video" autoplay muted playsinline webkit-playsinline></video><img id="photo" hidden><div id="hint" class="hint">Kamera starten. Danach zwei Punkte auf einem bekannten Gegenstand markieren.</div><div id="p1" class="point" hidden></div><div id="p2" class="point" hidden></div><div id="ruler" class="ruler" hidden><div class="ruler-scale">${Array.from({length:11},(_,i)=>`<span>${i}</span>`).join('')}</div><button id="rotate" class="rotate" type="button">↻</button></div></div><div id="status" class="status"></div><div class="small">Die Messung ist eine kalibrierte Näherung und ersetzt kein Präzisionsmessgerät.</div></section>
<script>
const ACCESS_CODE="umfang13";let q=0,stream=null,calibrating=false,points=[],scale=1,angle=0,x=0,y=0,drag=null;
const $=id=>document.getElementById(id),login=$("login"),app=$("app"),form=$("loginForm"),code=$("code"),question=$("question"),error=$("error"),video=$("video"),stage=$("stage"),hint=$("hint"),status=$("status"),p1=$("p1"),p2=$("p2"),ruler=$("ruler"),photo=$("photo");
function unlock(){if(code.value===ACCESS_CODE&&q>=2){login.hidden=true;app.hidden=false}else error.textContent=""}
question.onclick=()=>{q++;if(q>=2)unlock()};form.onsubmit=e=>e.preventDefault();
$("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;hint.textContent="Kalibrierung aktivieren und zwei Punkte markieren."}catch(e){hint.textContent="Kamerazugriff nicht möglich. Bitte HTTPS und Berechtigung prüfen."}};
$("calibrate").onclick=()=>{calibrating=true;points=[];p1.hidden=p2.hidden=true;hint.textContent="Zwei Punkte auf dem bekannten Referenzobjekt antippen."};
stage.onclick=e=>{if(!calibrating||e.target!==stage||points.length>=2)return;const r=stage.getBoundingClientRect(),pt={x:e.clientX-r.left,y:e.clientY-r.top};points.push(pt);const el=points.length===1?p1:p2;el.style.left=pt.x+"px";el.style.top=pt.y+"px";el.hidden=false;if(points.length===2){calibrating=false;const d=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y);scale=d/10;status.textContent="Referenzstrecke markiert. Das Lineal kann verschoben und gedreht werden.";hint.textContent="Lineal einblenden oder neue Kalibrierung starten."}};
function update(){ruler.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale?Math.max(.7,Math.min(2,scale/28)):1})`};$("rulerToggle").onclick=()=>{ruler.hidden=!ruler.hidden;if(!ruler.hidden){x=stage.clientWidth/2-140;y=stage.clientHeight/2-27;update()}};$("rotate").onclick=e=>{e.stopPropagation();angle+=15;update()};
ruler.onpointerdown=e=>{if(e.target.id==="rotate")return;drag={x:e.clientX,y:e.clientY,ox:x,oy:y};ruler.setPointerCapture(e.pointerId)};ruler.onpointermove=e=>{if(!drag)return;x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;update()};ruler.onpointerup=()=>drag=null;ruler.onpointercancel=()=>drag=null;
$("take").onclick=()=>{if(!video.videoWidth)return;const c=document.createElement("canvas"),w=video.videoWidth,h=video.videoHeight;c.width=w;c.height=h;c.getContext("2d").drawImage(video,0,0,w,h);photo.src=c.toDataURL("image/jpeg",.9);photo.hidden=false;hint.textContent="Foto aufgenommen."};$("reset").onclick=()=>location.reload();
</script></body></html>
