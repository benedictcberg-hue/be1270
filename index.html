<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fff; }
  .login-form { width: min(100%, 340px); display: flex; flex-direction: column; gap: 12px; }
  input, button { width: 100%; min-height: 50px; border: 1px solid #d0d0d0; border-radius: 12px; padding: 0 16px; font: inherit; background: #fff; }
  input { color: #111; }
  .row { display: grid; grid-template-columns: 1fr 56px; gap: 10px; }
  .row button { width: 56px; padding: 0; font-size: 24px; }
  .send { color: #111; }
  .error { min-height: 20px; color: #b00020; font-size: 14px; }
  .tool { min-height: 100dvh; padding: 16px; }
  .tool[hidden] { display: none; }
  .login[hidden] { display: none; }
</style>
</head>
<body>
<main id="login" class="login">
  <form id="loginForm" class="login-form" autocomplete="off">
    <div class="row">
      <input id="code" type="password" inputmode="text" aria-label="Code">
      <button id="questionButton" type="button" aria-label="Code senden">?</button>
    </div>
    <button class="send" type="submit">Senden</button>
    <div id="error" class="error" aria-live="polite"></div>
  </form>
</main>
<main id="tool" class="tool" hidden>
  <!-- Hier wird das Tool eingefügt. -->
</main>
<script>
const ACCESS_CODE = "umfang13";
const login = document.getElementById("login");
const tool = document.getElementById("tool");
const form = document.getElementById("loginForm");
const code = document.getElementById("code");
const questionButton = document.getElementById("questionButton");
const error = document.getElementById("error");
let questionPresses = 0;

function sendCode() {
  if (code.value === ACCESS_CODE && questionPresses >= 2) {
    login.hidden = true;
    tool.hidden = false;
    error.textContent = "";
  } else {
    error.textContent = "";
  }
}

questionButton.addEventListener("click", () => {
  questionPresses += 1;
  if (questionPresses >= 2) sendCode();
});

form.addEventListener("submit", (event) => {
  event.preventDefault();
  // „Senden“ ist nur Tarnung und löst keine Prüfung aus.
});
</script>
</body>
</html>
