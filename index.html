<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title></title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.login-form{width:min(100%,340px);display:flex;flex-direction:column;gap:12px}.row{display:grid;grid-template-columns:1fr 56px;gap:10px}input,button{min-height:50px;border:1px solid #ccc;border-radius:12px;background:#fff;font:inherit}input{width:100%;padding:0 16px}.row button{width:56px;font-size:24px}.send{width:100%}.error{min-height:20px;color:#b00020;font-size:14px}.app{padding:14px}.app[hidden],.login[hidden],.point[hidden],.ruler[hidden],#photo[hidden]{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{padding:0 13px}.stage{position:relative;width:100%;max-width:700px;margin:auto;aspect-ratio:3/4;overflow:hidden;border-radius:22px;background:#101820;touch-action:none}.stage.video-mode video{pointer-events:none}.stage video,#photo{display:block;width:100%;height:100%;object-fit:cover}.stage img{position:absolute;inset:0;z-index:1;pointer-events:none}.hint{position:absolute;z-index:4;top:12px;left:12px;right:12px;padding:10px;border-radius:10px;color:#fff;background:#0008;font-size:14px;pointer-events:none}.point{position:absolute;z-index:8;width:30px;height:30px;margin:-15px 0 0 -15px;border:3px solid #fff;border-radius:50%;background:#e33;pointer-events:none}.ruler{position:absolute;z-index:7;width:280px;height:54px;border:2px solid #fff;border-radius:8px;background:#fff3;box-shadow:0 2px 12px #0006;touch-action:none;user-select:none;backdrop-filter:blur(2px)}.ruler-scale{display:flex;justify-content:space-around;color:#fff;padding-top:7px;font-size:12px}.ruler-scale span{position:relative}.ruler-scale span:before{content:"";position:absolute;top:16px;left:50%;height:22px;border-left:1px solid #fff}.rotate{position:absolute;right:-18px;top:-18px;width:36px;height:36px;min-height:36px;border-radius:50%;color:#fff;background:#000b}.status{max-width:700px;margin:10px auto;font-size:14px}.small{font-size:12px;color:#555}.card{position:absolute;z-index:6;width:220px;height:139px;border:2px solid #4ff;border-radius:10px;background:linear-gradient(135deg,#1b7b88aa,#14202aaa);box-shadow:0 2px 12px #0008;touch-action:none;user-select:none;color:#fff;padding:14px}.card:after{content:"EC";position:absolute;right:12px;bottom:10px;font-size:20px;font-weight:700;opacity:.7}.card[hidden]{display:none}</style></head><body><section id="login" class="login"><form id="loginForm" class="login-form" autocomplete="off"><div class="row"><input id="code" type="password" inputmode="text" aria-label="Code"><button id="question" type="button">?</button></div><button class="send" type="submit">Senden</button><div id="error" class="error"></div></form></section><section id="app" class="app" hidden><div class="toolbar"><button id="start">Kamera starten</button><button id="calibrate">Punkte</button><button id="cardMode">EC-Karte</button><button id="rulerToggle">Lineal</button><button id="take">Foto</button><button id="reset">Reset</button></div><div class="stage" id="stage"><video id="video" autoplay muted playsinline webkit-playsinline></video><img id="photo" hidden><div id="hint" class="hint">Kamera starten.</div><div id="p1" class="point" hidden></div><div id="p2" class="point" hidden></div><div id="card" class="card" hidden>Referenzkarte<br><small>85,60 × 53,98 mm</small></div><div id="ruler" class="ruler" hidden><div class="ruler-scale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div><button id="rotate" class="rotate" type="button">↻</button></div></div><div id="status" class="status"></div><div class="small">Die EC-Karte ist als Referenz im ID-1-Format hinterlegt: 85,60 × 53,98 mm.</div></section><script>const ACCESS_CODE="umfang13";let q=0,stream=null,calibrating=false,points=[],angle=0,x=0,y=0,drag=null;const $=id=>document.getElementById(id),login=$("login"),app=$("app"),form=$("loginForm"),code=$("code"),question=$("question"),error=$("error"),video=$("video"),stage=$("stage"),hint=$("hint"),status=$("status"),p1=$("p1"),p2=$("p2"),ruler=$("ruler"),card=$("card"),photo=$("photo");function unlock(){if(code.value===ACCESS_CODE&&q>=2){login.hidden=true;app.hidden=false}}question.onclick=()=>{q++;if(q>=2)unlock()};form.onsubmit=e=>e.preventDefault();$("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;hint.textContent="EC-Karte-Modus oder Punkte auswählen."}catch(e){hint.textContent="Kamera nicht verfügbar."}};$("cardMode").onclick=()=>{card.hidden=!card.hidden;card.style.left=(stage.clientWidth/2-110)+"px";card.style.top=(stage.clientHeight/2-70)+"px";hint.textContent=card.hidden?"EC-Karte ausgeblendet.":"EC-Karte über die reale Karte legen und anpassen."};$("calibrate").onclick=()=>{calibrating=true;points=[];p1.hidden=true;p2.hidden=true;stage.classList.add("video-mode");hint.textContent="Zwei Punkte auf dem Bild antippen."};function addPoint(e){if(!calibrating||points.length>=2)return;const r=stage.getBoundingClientRect(),pt={x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))};points.push(pt);const el=points.length===1?p1:p2;el.style.left=pt.x+"px";el.style.top=pt.y+"px";el.hidden=false;if(points.length===2){calibrating=false;stage.classList.remove("video-mode");status.textContent="Zwei Referenzpunkte markiert.";hint.textContent="Referenz gespeichert."}}stage.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse"||e.button===0)addPoint(e)});stage.addEventListener("touchend",e=>{if(e.changedTouches[0])addPoint(e.changedTouches[0])},{passive:true});function move(el){el.onpointerdown=e=>{drag={el,x:e.clientX,y:e.clientY,ox:parseFloat(el.style.left)||0,oy:parseFloat(el.style.top)||0};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(drag&&drag.el===el){el.style.left=drag.ox+e.clientX-drag.x+"px";el.style.top=drag.oy+e.clientY-drag.y+"px"}};el.onpointerup=()=>drag=null;el.onpointercancel=()=>drag=null}move(card);$("rulerToggle").onclick=()=>{ruler.hidden=!ruler.hidden;if(!ruler.hidden){x=stage.clientWidth/2-140;y=stage.clientHeight/2-27;update()}};function update(){ruler.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg)`}$("rotate").onclick=e=>{e.stopPropagation();angle+=15;update()};ruler.onpointerdown=e=>{if(e.target.id==="rotate")return;drag={el:ruler,x:e.clientX,y:e.clientY,ox:x,oy:y};ruler.setPointerCapture(e.pointerId)};ruler.onpointermove=e=>{if(drag&&drag.el===ruler){x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;update()}};ruler.onpointerup=()=>drag=null;ruler.onpointercancel=()=>drag=null;$("take").onclick=()=>{if(!video.videoWidth)return;const c=document.createElement("canvas"),w=video.videoWidth,h=video.videoHeight;c.width=w;c.height=h;c.getContext("2d").drawImage(video,0,0,w,h);photo.src=c.toDataURL("image/jpeg",.9);photo.hidden=false;hint.textContent="Foto aufgenommen."};$("reset").onclick=()=>location.reload();</script></body></html>
